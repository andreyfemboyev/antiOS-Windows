name: Windows release build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Verify Windows binary invocation
        run: |
          .\target\release\antios.exe --version
          .\target\release\antios.exe --help
      - name: Package standalone executable
        shell: bash
        run: |
          set -euo pipefail
          version="$(target/release/antios.exe --version | awk '{print $2}')"
          mkdir -p stage/assets
          cp target/release/antios.exe stage/
          cp README.md LICENSE THIRD_PARTY_NOTICES.txt stage/
          cp -r screenshots stage/
          cp assets/*-OFL.txt assets/antios-mark.svg stage/assets/
          rust_sysroot=$(rustc --print sysroot)
          if command -v cygpath >/dev/null 2>&1; then rust_sysroot=$(cygpath -u "$rust_sysroot"); fi
          cp "$rust_sysroot/share/doc/rust/COPYRIGHT-library.html" stage/Rust-standard-library-notice.html
          (cd stage && python -m zipfile -c "../antiOS-${version}-windows-x86_64.zip" antios.exe README.md LICENSE THIRD_PARTY_NOTICES.txt Rust-standard-library-notice.html assets screenshots)
      - uses: actions/upload-artifact@v4
        with:
          name: antiOS-windows-x86_64
          path: antiOS-*-windows-x86_64.zip
          if-no-files-found: error
